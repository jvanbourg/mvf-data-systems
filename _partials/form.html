<form class="lead-form" data-practice="{{practice}}" action="https://formsubmit.co/ajax/marc.fertout@mvfdatasystems.com" method="post" novalidate aria-label="Consultation request">
            <div class="form-fields">
              <input type="hidden" name="_subject" value="{{subject}}">
              <input type="hidden" name="_template" value="table">
              <input type="hidden" name="_captcha" value="false">
              <input type="hidden" name="practice" value="{{practice}}">
              <div class="hp-field" aria-hidden="true">
                <label for="{{id}}-hp">Leave this field empty</label>
                <input type="text" id="{{id}}-hp" name="_honey" tabindex="-1" autocomplete="off">
              </div>
              <div class="row">
                <div class="field" data-validate>
                  <label for="{{id}}-name">Name</label>
                  <input type="text" id="{{id}}-name" name="name" autocomplete="name" required maxlength="120">
                  <span class="field-error" aria-live="polite"></span>
                </div>
                <div class="field" data-validate>
                  <label for="{{id}}-email">Work email</label>
                  <input type="email" id="{{id}}-email" name="email" autocomplete="email" required maxlength="160">
                  <span class="field-error" aria-live="polite"></span>
                </div>
              </div>
              {{company_row}}
              <div class="field" data-validate>
                <label for="{{id}}-message">What&rsquo;s the problem?</label>
                <textarea id="{{id}}-message" name="message" required maxlength="4000" rows="4" placeholder="{{placeholder}}"></textarea>
                <span class="field-error" aria-live="polite"></span>
              </div>
              <button class="btn" type="submit">Send</button>
              <p class="form-note">{{phi_note}}First consultation free. <a href="/privacy/">Privacy</a>.</p>
            </div>
            <div class="form-status" role="status" aria-live="polite"></div>
          </form>
